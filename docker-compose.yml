name: fastapi-base

services:
  api:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: fastapi-base-api
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir migrations
    networks:
      - default
  db:
    image: postgres:15
    container_name: fastapi-base-db
    env_file:
      - ./.env
    ports:
      - "5433:5432"
    volumes:
      - fastapi_base_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  fastapi_base_data:
